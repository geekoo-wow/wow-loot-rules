name: test

on:
  push:
    branches: ["**"]   # tags are covered by the release workflow, which calls this one
  pull_request:
  workflow_call:

# Lint, tests and the per-push test package live in the org's shared workflow:
# https://github.com/geekoo-wow/.github
# On pushes it also builds the addon without publishing it; the LootRules/
# folder is in the run's Artifacts, ready to drop into Interface/AddOns.
jobs:
  ci:
    uses: geekoo-wow/.github/.github/workflows/addon-ci.yml@v1
    with:
      addon-name: LootRules
      test-command: lua5.1 tests/run.lua
